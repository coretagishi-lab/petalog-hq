<html lang="ja">

<style>
:root{color-scheme:light;
  --page:#f9f9f7;--surface:#fcfcfb;--card:#ffffff;--ink:#0b0b0b;--ink2:#52514e;--muted:#898781;--grid:#e1e0d9;--base:#c3c2b7;--ring:rgba(11,11,11,.10);
  --s1:#2a78d6;--s2:#eb6834;--s3:#1baf7a;--s4:#eda100;--s5:#e87ba4;--s6:#008300;--s7:#6250d6;--s8:#e34948;
  --q100:#cde2fb;--q250:#86b6ef;--q400:#3987e5;--q550:#1c5cab;--q700:#0d366b;--good:#006300;--bad:#d03b3b;--accent:#C8412E}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){color-scheme:dark;
  --page:#0d0d0d;--surface:#1a1a19;--card:#1a1a19;--ink:#f0efec;--ink2:#c3c2b7;--muted:#898781;--grid:#2c2c2a;--base:#383835;--ring:rgba(255,255,255,.10);
  --s1:#3987e5;--s2:#d95926;--s3:#199e70;--s4:#c98500;--s5:#d55181;--s6:#008300;--s7:#9085e9;--s8:#e66767;--good:#0ca30c;--bad:#e66767}}
:root[data-theme="dark"]{color-scheme:dark;
  --page:#0d0d0d;--surface:#1a1a19;--card:#1a1a19;--ink:#f0efec;--ink2:#c3c2b7;--muted:#898781;--grid:#2c2c2a;--base:#383835;--ring:rgba(255,255,255,.10);
  --s1:#3987e5;--s2:#d95926;--s3:#199e70;--s4:#c98500;--s5:#d55181;--s6:#008300;--s7:#9085e9;--s8:#e66767;--good:#0ca30c;--bad:#e66767}
*{box-sizing:border-box}
body{margin:0;background:var(--page);color:var(--ink);font:14px/1.6 system-ui,-apple-system,"Hiragino Sans","Segoe UI",sans-serif;-webkit-text-size-adjust:100%}
header{position:sticky;top:0;z-index:1000;background:color-mix(in srgb,var(--page) 88%,transparent);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border-bottom:1px solid var(--grid)}
.hd{max-width:1180px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.hd h1{font-size:17px;margin:0;display:flex;align-items:center;gap:8px}.hd h1 i{width:10px;height:10px;border-radius:50%;background:var(--accent)}
.hd .sp{flex:1}
.seg{display:inline-flex;border-radius:999px;box-shadow:inset 0 0 0 1px var(--ring);overflow:hidden}
.seg button{border:0;background:none;color:var(--ink2);padding:6px 12px;font:inherit;font-size:13px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--page);font-weight:700}
.btn{border:0;border-radius:999px;padding:7px 12px;font:inherit;font-size:13px;background:var(--card);color:var(--ink);box-shadow:inset 0 0 0 1px var(--ring);cursor:pointer}
main{max-width:1180px;margin:0 auto;padding:12px 16px 60px}
.note{color:var(--ink2);font-size:12.5px;margin:4px 0 14px}
h2{font-size:15px;margin:28px 0 8px;display:flex;align-items:baseline;gap:8px}h2 small{font-weight:400;color:var(--muted);font-size:12px}
.grid{display:grid;gap:12px}
.g4{grid-template-columns:repeat(auto-fill,minmax(160px,1fr))}
.g2{grid-template-columns:repeat(auto-fit,minmax(min(100%,460px),1fr))}
.card{background:var(--card);border-radius:14px;box-shadow:inset 0 0 0 1px var(--ring);padding:14px;min-width:0}
.card h3{font-size:13px;margin:0 0 8px;color:var(--ink2);font-weight:600}
.tile b{display:block;font-size:26px;line-height:1.15;font-weight:700}
.tile span{font-size:12px;color:var(--muted)}
.tile .dl{font-size:12px;margin-top:2px}.up{color:var(--good)}.down{color:var(--bad)}
.chart{position:relative;width:100%}
.chart svg{display:block;width:100%;overflow:visible}
.legend{display:flex;flex-wrap:wrap;gap:12px;font-size:12px;color:var(--ink2);margin-bottom:6px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.tip{position:fixed;z-index:2000;pointer-events:none;background:var(--ink);color:var(--page);font-size:12px;line-height:1.5;padding:6px 9px;border-radius:8px;white-space:nowrap;box-shadow:0 4px 14px rgba(0,0,0,.2)}
.tip[hidden]{display:none}
table{border-collapse:collapse;width:100%;font-size:12.5px}
th,td{padding:5px 6px;text-align:right;white-space:nowrap}th{color:var(--muted);font-weight:600;border-bottom:1px solid var(--grid)}
td:first-child,th:first-child{text-align:left}
td.bar{width:45%;text-align:left}
.hb{height:12px;border-radius:0 4px 4px 0;background:var(--s1);min-width:2px}
.scroll{overflow-x:auto}
.heat td{padding:0;text-align:center;font-size:10.5px;min-width:22px;height:22px;border:1px solid var(--card)}
#map{height:420px;border-radius:12px;overflow:hidden}
.kv{display:grid;grid-template-columns:1fr auto;gap:4px 12px;font-size:13px}.kv span{color:var(--ink2)}.kv b{text-align:right}
.exit p{margin:2px 0 10px;color:var(--ink2);font-size:12.5px}
.gate{max-width:520px;margin:60px auto;padding:0 16px;text-align:center}
.gate a{color:var(--s1)}
.login{max-width:360px;margin:56px auto;background:var(--card);border-radius:16px;box-shadow:inset 0 0 0 1px var(--ring);padding:22px;text-align:left}
.login h2{margin:0 0 4px;font-size:17px}.login p{margin:0 0 14px;color:var(--ink2);font-size:12.5px}
.login label{display:block;font-size:12px;color:var(--ink2);margin:10px 0 4px}
.login input{width:100%;padding:10px 12px;border-radius:10px;border:1px solid var(--grid);background:var(--surface);color:var(--ink);font:inherit;font-size:16px}
.login button{width:100%;margin-top:16px;padding:11px;border:0;border-radius:999px;background:var(--ink);color:var(--page);font:inherit;font-weight:700;cursor:pointer}
.login .err{color:var(--bad);font-size:12.5px;margin-top:10px;min-height:1em}
.muted{color:var(--muted)}
.dl-row{display:flex;gap:8px;flex-wrap:wrap}
@media (max-width:600px){.tile b{font-size:22px}#map{height:320px}}
.rep{border-top:1px solid var(--grid);padding:10px 0}.rep:first-of-type{border-top:0}
.rep-h{display:flex;gap:10px;align-items:center}.rep-h img{width:44px;height:44px;object-fit:contain;border-radius:8px;background:#fff}
.rep ul{margin:6px 0;padding-left:18px;font-size:13px}.rep-a{display:flex;gap:6px;flex-wrap:wrap}.rep-a a{text-decoration:none}
.btn.warn{color:var(--bad)}.muted{color:var(--muted);font-size:12px}
.cfg{display:grid;gap:10px}.cfg label{display:grid;gap:4px;font-size:12.5px;color:var(--ink2)}
.cfg input{font:inherit;font-size:14px;padding:8px 10px;border-radius:10px;border:1px solid var(--grid);background:var(--surface);color:var(--ink)}
.cfg .btn{justify-self:start}
</style>

<body>
<header><div class="hd"><h1><i></i>ぺたろぐ HQ</h1><span class="sp"></span>
  <div class="seg" id="range" role="group" aria-label="期間"><button data-d="30" aria-pressed="false">30日</button><button data-d="90" aria-pressed="true">90日</button><button data-d="365" aria-pressed="false">1年</button><button data-d="3650" aria-pressed="false">全部</button></div>
  <button class="btn" id="reload">更新</button><button class="btn" id="logout" hidden>ログアウト</button></div></header>
<main id="main"><div class="gate"><p>読み込み中…</p></div></main>
<div class="tip" id="tip" hidden></div>

<script>
"use strict";
/* ぺたろぐ HQ（本部の統計サイト。アプリとは別のサイト。本部のアカウントでログインしたときだけ、サーバーが集計を返す） */
const CFG = { url: "https://xwhmmgqmiefnhcdpbuoz.supabase.co", key: "sb_publishable_ms34cIpwJimlU2tbgklmsw_t0vqQXSb" };
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const nf = n => (+n || 0).toLocaleString("ja-JP");
const pct = (a, b) => b ? Math.round(a / b * 1000) / 10 + "%" : "—";
const css = v => getComputedStyle(document.documentElement).getPropertyValue(v).trim();
const SER = ["--s1", "--s2", "--s3", "--s4", "--s5", "--s6", "--s7", "--s8"];
const EV = { open: "アプリを開いた", hide: "アプリを閉じた", view: "タブを移動", signup: "新規登録", login: "ログイン", stamp_add: "スタンプ登録", stamp_edit: "スタンプ編集", stamp_visit: "再訪の更新", stamp_del: "スタンプ削除",
  ai_identify: "AIで調べる", trivia_gen: "プチ情報を作る", trivia_fix: "プチ情報を直す", card_view: "トレカを見る", print_open: "印刷用を開く", print_save: "印刷用を保存", export: "画像で保存", pack: "開封演出",
  zukan_match: "図鑑さがし", zukan_reg: "図鑑に登録", journal_open: "ジャーナルを開く", cover_open: "表紙を開く", page_flip: "ページをめくる", page_new: "新しいページ", page_edit: "ページを編集", page_stamp: "ページにスタンプ",
  walk_start: "スタンプ集め開始", walk_stop: "スタンプ集め終了", pocket: "おさんぽモード", steps_iphone: "iPhoneの歩数", walk_page: "歩いた地図のページ", year_sum: "年のまとめ", map_mode: "地図の切り替え",
  report: "報告（終わってた/ちがうよ）", hq: "本部の一覧", rally_line: "特集の路線", others: "みんなのコレクション", grid_cols: "列の数を変える", settings: "設定", station: "駅を開く", pub_open: "みんなの記録を開く",
  recrop: "切り抜きを直す", retake: "写真を撮り直す", turn: "向きを直す", js_error: "エラー" };
let sb = null, DATA = null, DAYS = 90;
try { sb = supabase.createClient(CFG.url, CFG.key, { auth: { persistSession: true, autoRefreshToken: true, storageKey: "petalog-hq-auth", flowType: "implicit" } }); } catch (e) {}

/* ---------- ツールチップ ---------- */
const tip = $("#tip");
function showTip(html, x, y) { tip.innerHTML = html; tip.hidden = false; const w = tip.offsetWidth, h = tip.offsetHeight; tip.style.left = Math.min(innerWidth - w - 8, Math.max(8, x + 14)) + "px"; tip.style.top = Math.max(8, y - h - 12) + "px"; }
function hideTip() { tip.hidden = true; }
document.addEventListener("pointermove", e => { const t = e.target.closest && e.target.closest("[data-tip]"); if (t) showTip(t.dataset.tip, e.clientX, e.clientY); else if (!e.target.closest || !e.target.closest(".lc")) hideTip(); });

/* ---------- グラフ（SVG） ---------- */
const NS = "http://www.w3.org/2000/svg";
function niceMax(v) { if (v <= 4) return Math.max(1, Math.ceil(v)); const p = Math.pow(10, Math.floor(Math.log10(v))), m = v / p; return (m <= 1 ? 1 : m <= 2 ? 2 : m <= 5 ? 5 : 10) * p; }
const md = d => { const [, m, dd] = String(d).split("-"); return `${+m}/${+dd}`; };
function frame(el, H) { const W = Math.max(280, el.clientWidth || 600); el.innerHTML = ""; const s = document.createElementNS(NS, "svg"); s.setAttribute("viewBox", `0 0 ${W} ${H}`); s.setAttribute("height", H); el.appendChild(s); return { s, W, H }; }
function add(s, tag, at) { const e = document.createElementNS(NS, tag); for (const k in at) e.setAttribute(k, at[k]); s.appendChild(e); return e; }
function axes(s, W, H, L, B, max, x, fmt) {
  const T = 10, R = 12, ih = H - T - B, step = max / 4;
  for (let i = 0; i <= 4; i++) { const y = T + ih - ih * i / 4; add(s, "line", { x1: L, x2: W - R, y1: y, y2: y, stroke: css(i ? "--grid" : "--base"), "stroke-width": 1 }); const t = add(s, "text", { x: L - 6, y: y + 4, "text-anchor": "end", "font-size": 11, fill: css("--muted") }); t.textContent = fmt ? fmt(step * i) : nf(Math.round(step * i)); }
  const n = x.length, every = Math.max(1, Math.ceil(n / Math.max(2, Math.floor((W - L - R) / 64))));
  x.forEach((d, i) => { if (i % every && i !== n - 1) return; const xx = L + (n === 1 ? (W - L - R) / 2 : (W - L - R) * i / (n - 1)); const t = add(s, "text", { x: xx, y: H - B + 16, "text-anchor": "middle", "font-size": 11, fill: css("--muted") }); t.textContent = md(d); });
  return { T, R, ih };
}
// 折れ線（2本以上なら凡例＋右はしに名前）。ホバーで縦線と全部の値
function lineChart(el, x, series, o = {}) {
  const H = o.h || 220, { s, W } = frame(el, H), L = 44, B = 24; const max = niceMax(Math.max(1, ...series.flatMap(z => z.v)) * 1.05);
  const { T, R, ih } = axes(s, W, H, L, B, max, x, o.fmt); const n = x.length, X = i => L + (n === 1 ? (W - L - R) / 2 : (W - L - R) * i / (n - 1)), Y = v => T + ih - ih * v / max;
  series.forEach((z, k) => { const col = css(z.c || SER[k]); const d = z.v.map((v, i) => `${i ? "L" : "M"}${X(i).toFixed(1)},${Y(v).toFixed(1)}`).join("");
    if (o.area && k === 0) add(s, "path", { d: d + `L${X(n - 1)},${Y(0)}L${X(0)},${Y(0)}Z`, fill: col, "fill-opacity": .12 });
    add(s, "path", { d, fill: "none", stroke: col, "stroke-width": 2, "stroke-linejoin": "round", "stroke-linecap": "round" }); });
  if (series.length > 1) { el.insertAdjacentHTML("afterbegin", `<div class="legend">${series.map((z, k) => `<span><i style="background:${css(z.c || SER[k])}"></i>${esc(z.name)}</span>`).join("")}</div>`); }
  const cross = add(s, "line", { y1: T, y2: T + ih, stroke: css("--muted"), "stroke-width": 1, "stroke-dasharray": "3 3", opacity: 0 }); const dots = series.map((z, k) => add(s, "circle", { r: 4, fill: css(z.c || SER[k]), stroke: css("--card"), "stroke-width": 2, opacity: 0 }));
  const hit = add(s, "rect", { x: L, y: T, width: W - L - R, height: ih, fill: "transparent", class: "lc" });
  const mv = e => { const r = s.getBoundingClientRect(), px = (e.clientX - r.left) * W / r.width, i = Math.max(0, Math.min(n - 1, Math.round((px - L) / ((W - L - R) / Math.max(1, n - 1))))); cross.setAttribute("x1", X(i)); cross.setAttribute("x2", X(i)); cross.setAttribute("opacity", 1);
    dots.forEach((c, k) => { c.setAttribute("cx", X(i)); c.setAttribute("cy", Y(series[k].v[i])); c.setAttribute("opacity", 1); });
    showTip(`<b>${esc(x[i])}</b><br>${series.map((z, k) => `<span style="color:${css(z.c || SER[k])}">●</span> ${esc(z.name)}：${o.fmt ? o.fmt(z.v[i]) : nf(z.v[i])}`).join("<br>")}`, e.clientX, e.clientY); };
  hit.addEventListener("pointermove", mv); hit.addEventListener("pointerleave", () => { cross.setAttribute("opacity", 0); dots.forEach(c => c.setAttribute("opacity", 0)); hideTip(); });
}
function barChart(el, x, v, o = {}) {
  const H = o.h || 200, { s, W } = frame(el, H), L = 44, B = 24, max = niceMax(Math.max(1, ...v) * 1.05); const { T, R, ih } = axes(s, W, H, L, B, max, x);
  const n = x.length, bw = Math.max(2, (W - L - R) / Math.max(1, n) - 2), col = css(o.c || "--s1");
  v.forEach((val, i) => { const cx = L + (n === 1 ? (W - L - R) / 2 : (W - L - R) * i / (n - 1)), h = ih * val / max; if (!val) return;
    const r = Math.min(4, bw / 2, h); const x0 = cx - bw / 2, y0 = T + ih - h;
    add(s, "path", { d: `M${x0},${T + ih}V${y0 + r}Q${x0},${y0} ${x0 + r},${y0}H${x0 + bw - r}Q${x0 + bw},${y0} ${x0 + bw},${y0 + r}V${T + ih}Z`, fill: col, "data-tip": `<b>${esc(x[i])}</b><br>${esc(o.name || "")} ${nf(val)}` }); });
}
// 横棒（ランキング・内訳）
function hbars(el, rows, o = {}) {
  const max = Math.max(1, ...rows.map(r => r.v)); const col = o.c || "--s1";
  el.innerHTML = rows.length ? `<table><tbody>${rows.map(r => `<tr data-tip="${esc(r.l)}：${nf(r.v)}${r.sub ? "（" + esc(r.sub) + "）" : ""}"><td>${esc(r.l)}</td><td class="bar"><div class="hb" style="width:${(r.v / max * 100).toFixed(1)}%;background:var(${col})"></div></td><td>${nf(r.v)}</td>${o.sub ? `<td class="muted">${esc(r.sub || "")}</td>` : ""}</tr>`).join("")}</tbody></table>` : `<p class="muted">まだデータがありません</p>`;
}
// 1色の濃さ（ヒートマップ・コホート）
function seq(t) { const st = ["#cde2fb", "#b7d3f6", "#9ec5f4", "#86b6ef", "#6da7ec", "#5598e7", "#3987e5", "#2a78d6", "#256abf", "#1c5cab", "#184f95", "#104281", "#0d366b"]; return st[Math.max(0, Math.min(st.length - 1, Math.round(t * (st.length - 1))))]; }
function heatTable(el, rowsL, colsL, M, o = {}) {
  const max = Math.max(1, ...M.flat().filter(v => v != null));
  el.innerHTML = `<div class="scroll"><table class="heat"><thead><tr><th></th>${colsL.map(c => `<th style="text-align:center;font-size:10.5px">${esc(c)}</th>`).join("")}</tr></thead><tbody>${rowsL.map((r, i) => `<tr><th style="font-size:11px;padding-right:6px">${esc(r)}</th>${M[i].map((v, j) => v == null ? `<td></td>` : `<td data-tip="${esc(r)} ${esc(colsL[j])}：${o.fmt ? o.fmt(v, i, j) : nf(v)}" style="background:${v ? seq(v / max) : "transparent"};color:${v / max > .55 ? "#fff" : css("--ink2")}">${o.show ? (o.fmt ? o.fmt(v, i, j) : v || "") : ""}</td>`).join("")}</tr>`).join("")}</tbody></table></div>`;
}
function csv(name, rows) { const t = rows.map(r => r.map(v => /[",\n]/.test(String(v ?? "")) ? `"${String(v).replace(/"/g, '""')}"` : (v ?? "")).join(",")).join("\n"); const a = document.createElement("a"); a.href = URL.createObjectURL(new Blob(["﻿" + t], { type: "text/csv" })); a.download = name + ".csv"; a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 3000); }


/* ---------- 本部の作業: 「ちがうよ」報告の確認と、アプリ全体の設定 ---------- */
const nrm = v => String(v || "").normalize("NFKC").toLowerCase().replace(/[\s・･,.、。()（）「」『』\[\]【】<>"'!！?？~〜ー\-_/／|｜:：]/g, "");
const kmB = (a, b, c, d) => { const R = 6371, t = Math.PI / 180, x = Math.sin((c - a) * t / 2), y = Math.sin((d - b) * t / 2); return 2 * R * Math.asin(Math.sqrt(x * x + Math.cos(a * t) * Math.cos(c * t) * y * y)); };
async function ops() {
  if (!$("#ops")) $("#main").insertAdjacentHTML("afterbegin", `<h2 style="margin-top:6px">本部の作業 <small>アプリの設定画面から移しました</small></h2><div class="grid g2" id="ops"><div class="card" id="opRep"><h3>「ちがうよ」報告</h3><p class="note">読み込み中…</p></div><div class="card" id="opCfg"><h3>アプリ全体の設定</h3><p class="note">読み込み中…</p></div></div>`);
  reports(); config();
}
async function reports() {
  const box = $("#opRep"); if (!box) return;
  const { data: reps, error } = await sb.from("shares").select("id,nick,name,place,pref,lat,lng,rk,reason,spot,date,updated_at,type,kind,reviewed,design").eq("kind", "miss").eq("type", "wrong").limit(500);
  if (error) { box.innerHTML = `<h3>「ちがうよ」報告</h3><p class="note">読み込めませんでした（${esc(error.message || "")}）</p>`; return; }
  const open = (reps || []).filter(r => r.reviewed !== "ok"), G = [];
  for (const r of open) { let g = G.find(g => g.c.lat != null && r.lat != null && kmB(g.c.lat, g.c.lng, r.lat, r.lng) < 0.4 && ((r.rk && g.c.rk === r.rk) || (r.name && nrm(g.c.name) === nrm(r.name)))); if (!g) G.push(g = { c: r, reps: [], recs: [] }); g.reps.push(r); }
  for (const g of G) {
    if (g.c.lat == null) continue; const d = 0.006;
    const { data } = await sb.from("shares").select("id,nick,name,place,pref,lat,lng,rk,thumb,reviewed,kind,design").eq("kind", "record").gte("lat", g.c.lat - d).lte("lat", g.c.lat + d).gte("lng", g.c.lng - d * 1.25).lte("lng", g.c.lng + d * 1.25).limit(200);

  const max = Math.max(1, ...geo.map(g => g[2]));

  if (geo.length) { const b = L.latLngBounds(geo.map(g => [g[0], g[1]])); MAP.fitBounds(b.pad(0.3), { maxZoom: 11 }); }
}
$("#range").onclick = e => { const b = e.target.closest("[data-d]"); if (!b) return; DAYS = +b.dataset.d; $("#range").querySelectorAll("button").forEach(z => z.setAttribute("aria-pressed", z === b)); load(); };
$("#reload").onclick = () => load();
$("#logout").onclick = async () => { await sb.auth.signOut().catch(() => {}); DATA = null; loginForm(); };
let rt = 0; addEventListener("resize", () => { clearTimeout(rt); rt = setTimeout(() => DATA && render(DATA), 200); });
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => DATA && render(DATA));
load();
</script>
