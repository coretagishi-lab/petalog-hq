<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#f7f6f2">
<title>DESK</title>
<link rel="icon" href="../icon.png">
<link rel="apple-touch-icon" href="../icon.png">
<style>
:root{color-scheme:light;
  --page:#f7f6f2;--card:#ffffff;--ink:#141414;--ink2:#55534e;--muted:#8d8a83;--line:#e4e2db;--soft:#efeee8;
  --acc:#2B4C9B;--ok:#1a9e6b;--warn:#d9822b;--bad:#d64545;--now:#e5483b;
  --r:14px;--sh:0 1px 2px rgba(0,0,0,.05),0 4px 14px rgba(0,0,0,.05)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark;
  --page:#121212;--card:#1c1c1c;--ink:#f1f0ec;--ink2:#bdbab2;--muted:#8a877f;--line:#2e2d2a;--soft:#262522;--acc:#7f9cff;--sh:none}}
*{box-sizing:border-box;touch-action:manipulation}
html,body{margin:0;background:var(--page);color:var(--ink);font:15px/1.55 -apple-system,BlinkMacSystemFont,"Hiragino Sans","Noto Sans JP",sans-serif;-webkit-text-size-adjust:100%}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
main{max-width:720px;margin:0 auto;padding:calc(10px + env(safe-area-inset-top)) 16px calc(90px + env(safe-area-inset-bottom))}
h1{font-size:22px;margin:4px 0 2px;letter-spacing:.02em}
.sub{color:var(--muted);font-size:13px}
.top{display:flex;align-items:flex-end;justify-content:space-between;gap:10px;margin-bottom:10px}
.daynav{display:flex;gap:6px}
.daynav button,.chip{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:5px 12px;font-size:13px}
.chip.on{background:var(--ink);color:var(--page);border-color:var(--ink)}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px;margin:10px 0;box-shadow:var(--sh)}
.note{border-left:4px solid var(--acc);white-space:pre-line}
.note b{display:block;font-size:12px;color:var(--acc);margin-bottom:4px;letter-spacing:.06em}
.stats{display:flex;gap:10px}
.stat{flex:1;background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:10px 12px}
.stat b{display:block;font-size:24px;line-height:1.2;font-variant-numeric:tabular-nums}
.stat span{font-size:12px;color:var(--muted)}
.bar{height:6px;border-radius:9px;background:var(--soft);overflow:hidden;margin-top:6px}.bar i{display:block;height:100%;background:var(--ok);border-radius:9px}
.sec{font-size:12px;font-weight:700;color:var(--muted);letter-spacing:.08em;margin:18px 2px 6px}
.task{display:flex;gap:10px;background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:10px 12px;margin:8px 0;position:relative}
.task .tm{width:46px;flex:none;font-variant-numeric:tabular-nums;font-size:13px;color:var(--ink2);line-height:1.3}
.task .tm small{display:block;color:var(--muted);font-size:11px}
.task .bd{flex:1;min-width:0}
.task .tt{font-weight:700;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.task .pj{font-size:11px;font-weight:700;border-radius:6px;padding:1px 7px;color:#fff}
.task .meta{font-size:12px;color:var(--muted);margin-top:2px}
.task.done{opacity:.6}.task.done .tt span.t{text-decoration:line-through}
.task.skipped{opacity:.55}.task.doing{border-color:var(--acc);box-shadow:0 0 0 2px color-mix(in srgb,var(--acc) 25%,transparent)}
.task.now::before{content:"";position:absolute;left:-6px;top:14px;width:8px;height:8px;border-radius:50%;background:var(--now)}
.imp{color:var(--bad);font-size:11px;font-weight:800}
.steps{margin:8px 0 2px;padding:0;list-style:none}
.steps li{display:flex;gap:8px;align-items:flex-start;padding:4px 0;font-size:14px}
.steps input{width:18px;height:18px;margin-top:2px;flex:none;accent-color:var(--ok)}
.steps li.ck span{color:var(--muted);text-decoration:line-through}
.acts{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.btn{border:1px solid var(--line);background:var(--card);border-radius:10px;padding:7px 12px;font-size:13px;font-weight:600}
.btn.pri{background:var(--acc);border-color:var(--acc);color:#fff}
.btn.okb{background:var(--ok);border-color:var(--ok);color:#fff}
.btn.ghost{background:transparent}
.big{width:100%;padding:12px;font-size:15px}
.nowline{display:flex;align-items:center;gap:8px;color:var(--now);font-size:12px;font-weight:700;margin:6px 0}
.nowline::after{content:"";flex:1;height:2px;background:var(--now);border-radius:2px}
.empty{color:var(--muted);text-align:center;padding:24px 8px;font-size:14px}
.pain{border-left:4px solid #0F7A6C}
.pain .hd{display:flex;align-items:baseline;justify-content:space-between;gap:8px}
.pain .hd b{font-size:12px;color:#0F7A6C;letter-spacing:.06em}
.pain .hd span{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.pain .hd span.ok{color:var(--ok);font-weight:700}
.pain .q{font-size:13px;color:var(--ink2);margin:4px 0 8px}
.pain ol{margin:0 0 8px;padding:0;list-style:none}
.pain li{padding:4px 0;font-size:14px;display:flex;gap:8px;align-items:flex-start;justify-content:space-between}
.pain li span{min-width:0;white-space:pre-line}
.pain li button{flex:none;border:0;background:none;color:var(--muted);font-size:12px;padding:2px 4px}
.pain .add{display:flex;gap:6px}
.pain .add input{flex:1;min-width:0}
.pain .hd .r{display:flex;align-items:center;gap:8px}
.vo-stats{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:12.5px;color:var(--muted);font-variant-numeric:tabular-nums;margin:2px 0 8px}
.vo-stats b{color:var(--ink)}
.vo-bar{display:flex;gap:6px;margin-bottom:8px}
.vo-bar select,.vo-bar input{font-size:16px;border:1px solid var(--line);border-radius:10px;padding:7px 9px;background:var(--card);color:var(--ink);min-height:38px}
.vo-bar input{flex:1;min-width:0}
.vo-chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;margin-bottom:8px;scrollbar-width:none}
.vo-chips::-webkit-scrollbar{display:none}
.vo-chips button{flex:none;font-size:12.5px;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;padding:5px 11px;white-space:nowrap}
.vo-chips button.on{background:var(--ink);color:var(--card);border-color:var(--ink)}
.vo-chips button span{opacity:.6;margin-left:3px}
.vo{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:8px}
.vo.ok{border-color:#0F7A6C;box-shadow:inset 3px 0 0 #0F7A6C}
.vo.maybe{border-color:#B46A00;box-shadow:inset 3px 0 0 #B46A00}
.vo.no{opacity:.5}
.vo .top{display:flex;gap:8px;align-items:flex-start}
.vo .tx{flex:1;min-width:0;font-size:14.5px;font-weight:500;line-height:1.5}
.vo .mt{font-size:11px;color:var(--muted);font-weight:400;margin-top:2px}
.vo .bt{flex:none;display:flex;gap:4px}
.vo .bt button{width:34px;height:34px;border-radius:50%;border:1.5px solid var(--line);background:var(--card);font-size:14px;font-weight:700;color:var(--muted);padding:0}
.vo .bt button.on[data-vv="ok"]{background:#0F7A6C;border-color:#0F7A6C;color:#fff}
.vo .bt button.on[data-vv="maybe"]{background:#B46A00;border-color:#B46A00;color:#fff}
.vo .bt button.on[data-vv="no"]{background:#8A949A;border-color:#8A949A;color:#fff}
.vo .memo{width:100%;margin-top:6px;border:0;border-top:1px dashed var(--line);padding:6px 0 0;font-size:16px;background:transparent;color:var(--ink)}
.pgbtn{border:1px solid #0F7A6C;color:#0F7A6C;background:transparent;border-radius:999px;padding:3px 10px;font-size:12px;font-weight:700}
.pg h3{margin:0 0 4px;font-size:17px}
.pg .sub{font-size:12.5px;color:var(--muted);margin:0 0 10px}
.pg ol{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:8px}
.pg li{border:1px solid var(--line);border-radius:10px;padding:9px 12px}
.pg li b{font-size:14px;display:block}
.pg li .a{font-size:13.5px;color:#0F7A6C;font-weight:600;margin:2px 0}
.pg li .e{font-size:12.5px;color:var(--muted)}
.pg .chk{margin-top:12px;background:rgba(15,122,108,.08);border-radius:10px;padding:10px 12px;font-size:13px}
.pg .chk b{color:#0F7A6C}
.bd-plan{border-left:6px solid #c0552f}
.bd-plan h3{margin:0 0 2px;font-size:17px}
.qadd{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:10px 0}
.qadd button{border:1px solid var(--line);background:var(--card);border-radius:12px;padding:12px 4px;font-weight:700;font-size:14px;box-shadow:var(--sh)}
.qadd button small{display:block;font-weight:400;font-size:11px;color:var(--muted)}
.ent{display:flex;gap:10px;align-items:flex-start;padding:7px 0;border-bottom:1px solid var(--line);font-size:14px}
.ent:last-child{border-bottom:0}
.ent .k{flex:none;font-size:11px;font-weight:700;border-radius:6px;padding:1px 7px;color:#fff;margin-top:2px}
.ent .k.workout{background:#c0552f}.ent .k.meal{background:#1a9e6b}.ent .k.body{background:#2B4C9B}
.ent .x{flex:1;min-width:0;white-space:pre-line}
.ent .x small{display:block;color:var(--muted);font-size:12px}
.ent button{flex:none;border:0;background:none;color:var(--muted);font-size:12px;padding:2px 4px}
.tot{display:flex;gap:10px;margin-top:8px}
.tot div{flex:1;background:var(--soft);border-radius:10px;padding:8px 10px}
.tot b{display:block;font-size:18px;font-variant-numeric:tabular-nums}
.tot span{font-size:11px;color:var(--muted)}
.chart{width:100%;height:auto;display:block}
.chart text{fill:var(--muted);font-size:10px}
.hist .row{display:grid;grid-template-columns:64px 1fr 1fr 1fr;gap:6px;padding:7px 0;border-bottom:1px solid var(--line);font-size:13px;font-variant-numeric:tabular-nums}
.hist .row.h{color:var(--muted);font-size:11px;font-weight:700}
.tabs{position:fixed;left:0;right:0;bottom:0;background:color-mix(in srgb,var(--card) 92%,transparent);backdrop-filter:blur(10px);border-top:1px solid var(--line);display:flex;padding:6px 6px calc(6px + env(safe-area-inset-bottom));z-index:10}
.tabs button{flex:1;min-width:0;white-space:nowrap;letter-spacing:-.02em;border:0;background:none;padding:6px 0;font-size:10.5px;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:2px}
.tabs button b{font-size:18px;line-height:1}
.tabs button.on{color:var(--ink);font-weight:700}
.week .row{display:flex;gap:10px;align-items:flex-start;padding:10px 0;border-bottom:1px solid var(--line)}
.week .d{width:52px;flex:none}.week .d b{font-size:18px;display:block;line-height:1.1}.week .d span{font-size:12px;color:var(--muted)}
.week .row.today .d b{color:var(--now)}
.week .ls{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px}
.week .it{font-size:13px;display:flex;gap:6px;align-items:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.week .it i{width:8px;height:8px;border-radius:2px;flex:none}
.week .it.done{color:var(--muted);text-decoration:line-through}
.week .pc{width:42px;text-align:right;font-weight:700;font-variant-numeric:tabular-nums;font-size:14px}
.month{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.month .h{font-size:11px;color:var(--muted);text-align:center}
.month .c{aspect-ratio:1/1.1;border-radius:10px;background:var(--card);border:1px solid var(--line);padding:4px;font-size:12px;display:flex;flex-direction:column;justify-content:space-between}
.month .c.o{opacity:.35}.month .c.today{border-color:var(--now);border-width:2px}
.month .c em{font-style:normal;font-size:11px;font-weight:700;align-self:flex-end;font-variant-numeric:tabular-nums}
.pjc{border-left:6px solid var(--acc)}
.pjc h3{margin:0 0 2px;font-size:17px}
.kv{display:grid;grid-template-columns:84px 1fr;gap:4px 10px;font-size:14px;margin-top:8px}
.kv dt{color:var(--muted);font-size:12px;padding-top:2px}.kv dd{margin:0;white-space:pre-line}
.kv dd.bad{color:var(--bad)}.kv dd.ok{color:var(--ok)}
.sheet{position:fixed;inset:0;background:rgba(0,0,0,.35);display:flex;align-items:flex-end;justify-content:center;z-index:20}
.sheet[hidden]{display:none}
.sheet .in{background:var(--card);width:100%;max-width:720px;border-radius:18px 18px 0 0;padding:16px 16px calc(20px + env(safe-area-inset-bottom));max-height:92vh;overflow:auto}
label.lb{display:block;font-size:12px;color:var(--muted);margin:10px 0 4px}
input.f,select.f,textarea.f{width:100%;border:1px solid var(--line);background:var(--page);border-radius:10px;padding:10px 12px;font-size:16px}
.r2{display:flex;gap:8px}.r2>*{flex:1}
.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--ink);color:var(--page);padding:9px 16px;border-radius:999px;font-size:13px;opacity:0;transition:.2s;pointer-events:none;z-index:30;white-space:nowrap}
.toast.on{opacity:1}
.login{max-width:360px;margin:12vh auto 0}
.pill{display:inline-block;font-size:11px;border-radius:999px;padding:1px 8px;background:var(--soft);color:var(--ink2);font-weight:600}
.diff.over{color:var(--bad)}.diff.under{color:var(--ok)}
.kanban{display:block;text-decoration:none;color:#fff;background:linear-gradient(135deg,#1b1b2f 0%,#3a1c4a 55%,#c2185b 100%);border-radius:18px;padding:16px 18px 14px;margin:0 0 14px;box-shadow:0 6px 18px rgba(0,0,0,.18);position:relative;overflow:hidden}
.kanban::after{content:"";position:absolute;right:-30px;top:-30px;width:140px;height:140px;border-radius:50%;background:rgba(255,255,255,.07)}
.kanban .k1{font-size:11px;letter-spacing:.18em;opacity:.75;font-weight:700}
.kanban .k2{font-size:26px;line-height:1.3;font-weight:900;margin:6px 0 8px;letter-spacing:.02em;text-wrap:balance}
.kanban .k3{font-size:13px;opacity:.9;line-height:1.6}
.today-pj{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh);padding:6px 14px;margin:0 0 14px}
.today-pj .hd{font-size:12px;color:var(--muted);font-weight:700;letter-spacing:.06em;padding:6px 0 2px}
.tp{display:block;padding:9px 0;border-top:1px solid var(--line)}
.tp:first-of-type{border-top:0}
.tp .row{display:flex;align-items:center;gap:8px}
.tp .nm{font-weight:800;font-size:15px;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-align:left;background:none;border:0;padding:0;color:var(--ink)}
.tp .nm::after{content:" ›";color:var(--muted);font-weight:400}
.tp .v{font-size:12px;color:var(--ink2);white-space:nowrap;flex:none;font-variant-numeric:tabular-nums}
.tp .bar{margin-top:6px}
.tp .sub2{font-size:12px;color:var(--muted);margin-top:3px}
.tp .cnts{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.cnt{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:999px;padding:3px 4px 3px 10px;font-size:12.5px;background:var(--soft)}
.cnt b{font-variant-numeric:tabular-nums}
.cnt button{border:0;background:var(--card);border-radius:999px;width:28px;height:28px;font-size:16px;font-weight:800;color:var(--ink);box-shadow:0 0 0 1px var(--line)}
.cnt.ok{background:color-mix(in srgb,var(--ok) 14%,var(--card));border-color:var(--ok)}
.kanban .k5{margin-top:12px;padding-top:10px;border-top:1px dashed rgba(255,255,255,.4);font-size:17px;line-height:1.45;font-weight:900}
.kanban .k5::before{content:"自分の心構え";display:block;font-size:11px;letter-spacing:.18em;opacity:.75;font-weight:700;margin-bottom:4px}
.kanban .k4{display:inline-flex;align-items:center;gap:6px;margin-top:10px;font-size:12.5px;font-weight:800;background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.35);border-radius:999px;padding:5px 12px}
.phc .phn{float:right;font-weight:400;color:var(--muted);font-size:12px}
.phb{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:4px 0 10px}
.phb button{border:1px solid var(--line);background:var(--soft);border-radius:12px;padding:12px 4px;font-weight:800;font-size:15px}
.phb button small{display:block;font-weight:400;font-size:11px;color:var(--muted)}
.phrow{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px}
.pht{position:relative;flex:none;width:84px;aspect-ratio:3/4;border:0;padding:0;border-radius:10px;overflow:hidden;background:var(--soft)}
.pht img{width:100%;height:100%;object-fit:cover;display:block}
.pht span{position:absolute;left:4px;bottom:4px;font-size:10.5px;font-weight:800;color:#fff;background:rgba(0,0,0,.55);border-radius:5px;padding:0 5px}
#ph{position:fixed;inset:0;z-index:60;background:var(--page);overflow-y:auto;padding-bottom:calc(40px + env(safe-area-inset-bottom))}
.phh{position:sticky;top:0;z-index:2;display:flex;align-items:center;justify-content:space-between;gap:8px;padding:calc(10px + env(safe-area-inset-top)) 14px 10px;background:var(--page);border-bottom:1px solid var(--line)}
.phh button{border:0;background:none;font-size:14px;font-weight:700;padding:6px 2px}
.phf{display:flex;gap:6px;padding:10px 14px;overflow-x:auto}
.phf button{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:6px 14px;font-size:13px;font-weight:700;flex:none}
.phf button.on{background:var(--ink);color:var(--page);border-color:var(--ink)}
.phd{padding:14px 14px 6px;font-weight:800;font-size:14px}.phd small{color:var(--muted);font-weight:400;margin-left:6px}
.phg{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;padding:0 14px}
.phg .pht{width:auto;border-radius:6px}
.phcmp{margin:0 14px;padding:10px;border:1px solid var(--line);border-radius:12px;background:var(--card)}
.phcmp .two{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}
.phcmp select{width:100%;font-size:16px;margin-bottom:6px;border:1px solid var(--line);border-radius:8px;background:var(--card);padding:4px}
.phcmp img{width:100%;aspect-ratio:3/4;object-fit:cover;border-radius:8px;background:var(--soft);display:block}
#pv{position:fixed;inset:0;z-index:70;background:#000;display:flex;flex-direction:column;color:#fff}
#ph[hidden],#pv[hidden]{display:none}
.pvt{display:flex;justify-content:space-between;align-items:center;padding:calc(10px + env(safe-area-inset-top)) 14px 10px;font-weight:700;font-size:14px}
.pvt button,.pvo button{border:0;background:rgba(255,255,255,.16);color:#fff;border-radius:999px;padding:7px 14px;font-size:14px;font-weight:700}
.pvi{flex:1;position:relative;min-height:0}
.pvi img{width:100%;height:100%;object-fit:contain;display:block}
.pvp,.pvn{position:absolute;top:50%;transform:translateY(-50%);border:0;background:rgba(0,0,0,.35);color:#fff;font-size:30px;width:44px;height:64px;border-radius:10px}
.pvp{left:6px}.pvn{right:6px}
.pvo{display:flex;gap:8px;justify-content:center;padding:12px 14px calc(14px + env(safe-area-inset-bottom))}
.pvo button.on{background:#fff;color:#000}
</style>
</head>
<body>
<main id="main"><div class="empty">読み込み中…</div></main>
<nav class="tabs" id="tabs" hidden>
  <button data-v="day"><b>◉</b>今日</button>
  <button data-v="week"><b>☰</b>週</button>
  <button data-v="month"><b>▦</b>月</button>
  <button data-v="body"><b>💪</b>からだ</button>
  <button data-v="voice"><b>🔍</b>痛み</button>
  <button data-v="proj"><b>◆</b>プロジェクト</button>
  <button data-v="add"><b>＋</b>追加</button>
</nav>
<div class="sheet" id="sheet" hidden><div class="in" id="sheetIn"></div></div>
<div class="toast" id="toast"></div>
<div id="ph" hidden></div><div id="pv" hidden></div>
<input type="file" id="phCam" accept="image/*" capture="environment" hidden>
<input type="file" id="phLib" accept="image/*" multiple hidden>
<script src="../vendor/supabase.js"></script>
<script>
'use strict';

function rate(L) { const n = L.filter(t => t.status !== "inbox").length, d = L.filter(t => t.status === "done").length; return n ? Math.round(d / n * 100) : null; }
function taskHTML(t, nowISO) {
  const p = pj(t.project_id), open = S.open.has(t.id), plan = mins(t.start_at, t.end_at), act = t.act_min ?? mins(t.act_start, t.act_end);
  const isNow = t.start_at && t.end_at && nowISO >= t.start_at && nowISO < t.end_at && t.status !== "done";
  const steps = Array.isArray(t.steps) ? t.steps : [];

  const diff = plan != null && act != null ? act - plan : null;
  return `<div class="task ${t.status}${isNow ? " now" : ""}" data-id="${t.id}">
    <div class="tm">${t.start_at ? hm(t.start_at) : "—"}${t.end_at ? `<small>〜${hm(t.end_at)}</small>` : ""}</div>
    <div class="bd"><div class="tt">${p ? `<span class="pj" style="background:${esc(p.color)}">${esc(p.emoji ? p.emoji + " " : "")}${esc(p.name)}</span>` : ""}${t.important ? '<span class="imp">重要</span>' : ""}<span class="t">${esc(t.title)}</span></div>
      <div class="meta">${[t.status === "done" ? "✓ 完了" : t.status === "doing" ? `▶ ${hm(t.act_start)}から作業中` : t.status === "skipped" ? `できなかった${t.skip_reason ? "：" + esc(t.skip_reason) : ""}` : "", steps.length ? `手順 ${sd}/${steps.length}` : "", act != null ? `実績${fmtMin(act)}` : plan != null ? `予定${fmtMin(plan)}` : ""].filter(Boolean).join(" · ")}${diff != null && Math.abs(diff) >= 5 ? ` <span class="diff ${diff > 0 ? "over" : "under"}">(${diff > 0 ? "+" : ""}${diff}分)</span>` : ""}</div>
      ${open ? `${steps.length ? `<ul class="steps">${steps.map((s, i) => `<li class="${s.done ? "ck" : ""}"><input type="checkbox" data-step="${t.id}|${i}" ${s.done ? "checked" : ""}><span>${esc(s.t)}</span></li>`).join("")}</ul>` : ""}
        ${t.note ? `<div class="sub" style="white-space:pre-line;margin-top:6px">${esc(t.note)}</div>` : ""}
        <div class="acts">${t.status === "todo" ? `<button class="btn pri" data-act="start|${t.id}">▶ 開始</button><button class="btn okb" data-act="done|${t.id}">✓ 完了</button>` : ""}

          <button class="btn ghost" data-act="edit|${t.id}">編集</button></div>` : ""}
    </div></div>`;
}
function vDay() {

  const timed = L.filter(t => t.start_at).sort((a, b) => a.start_at.localeCompare(b.start_at)), free = L.filter(t => !t.start_at);

  const note = S.notes.find(n => n.day === d && n.kind === "claude") || (isToday ? S.notes.find(n => n.kind === "claude") : null);

  for (const t of timed) { if (!nowShown && t.start_at > nowISO) { tl += `<div class="nowline">いま ${hm(nowISO)}</div>`; nowShown = true; } tl += taskHTML(t, nowISO); }
  if (!nowShown && timed.length) tl += `<div class="nowline">いま ${hm(nowISO)}</div>`;
  return `<div class="top"><div><h1>${isToday ? "今日" : dayLabel(d).replace(/（.*/, "")}</h1><div class="sub">${dayLabel(d)}</div></div>

}

  if (error) { S.pains = S.pains.filter(x => x !== tmp); render(); toast("保存できませんでした"); return; }

const VO = { list: null, loading: false, mark: "todo", g: "all", q: "", shown: 50 };
try { const f = JSON.parse(localStorage.getItem("desk.vo") || "{}"); if (f.mark) VO.mark = f.mark; if (f.g) VO.g = f.g; } catch (e) {}
const voSave = () => { try { localStorage.setItem("desk.vo", JSON.stringify({ mark: VO.mark, g: VO.g })); } catch (e) {} };
async function voLoad() {
  if (VO.loading) return; VO.loading = true; let all = [], from = 0;
  while (true) {
    const { data, error } = await sb.from("desk_notes").select("id,day,text,created_at").eq("kind", "voice").order("created_at", { ascending: true }).range(from, from + 999);
    if (error) { VO.loading = false; toast("痛みの声を読み込めませんでした"); return; }

function vVoice() {

function lineChart(pts, unit, color) {
  if (pts.length < 2) return `<div class="sub">記録が2日分そろうと、ここにグラフが出ます</div>`;
  const W = 320, H = 120, L = 30, R = 8, T = 10, B = 20, xs = pts.map(p => Date.parse(p[0])), ys = pts.map(p => p[1]);
  const x0 = Math.min(...xs), x1 = Math.max(...xs), lo = Math.floor(Math.min(...ys) - 0.5), hi = Math.ceil(Math.max(...ys) + 0.5);

function readForm(old) {

}
// 実際の開始・終了に合わせて、その日のこのあとの予定を自動でずらす（同じ長さのまま）
async function shiftAfter(t, dl, self) {
  if (!t.day || !t.start_at) return;
  const sh = iso => iso ? new Date(new Date(iso).getTime() + dl * 60000).toISOString() : null;
  const L = S.tasks.filter(x => x.day === t.day && x.start_at && x.status === "todo" && x.id !== t.id && x.start_at >= t.start_at);
  const patches = []; if (self && t.end_at) patches.push([t, { end_at: sh(t.end_at) }]);
  for (const x of L) patches.push([x, { start_at: sh(x.start_at), end_at: sh(x.end_at) }]);
  for (const [x, p] of patches) { Object.assign(x, p); sb.from("desk_tasks").update(p).eq("id", x.id).then(r => { if (r.error) toast("ずらせませんでした"); }); }
  render(); if (L.length) toast(`このあとの予定を${dl > 0 ? dl + "分うしろ" : -dl + "分まえ"}にずらしました`);
}

// 毎日の目標はここで変える
const DAILY = { dcComments: 5, petaPost: 1, petaCall: 5, protein: 110 };
const PV_FEE = 20000, PV_NET = Math.round(20000 * (1 - 0.1021));   // 源泉徴収10.21%を引いた振込額
S.daily = { dc: null, pv: null, row: null, v: {} };
async function loadDaily() {
  const d = today(), m0 = d.slice(0, 8) + "01";
  const [pv, dl, dc] = await Promise.all([
    sb.from("desk_notes").select("id,day,text").eq("kind", "pv").gte("day", m0),
    sb.from("desk_notes").select("id,day,text").eq("kind", "daily").eq("day", d).limit(1),
    sb.from("dcout_people").select("data")]);
  S.daily.pv = (pv.data || []).reduce((a, r) => { try { return a + (JSON.parse(r.text).n || 0); } catch (e) { return a; } }, 0);
  S.daily.row = (dl.data || [])[0] || null; try { S.daily.v = S.daily.row ? JSON.parse(S.daily.row.text) : {}; } catch (e) { S.daily.v = {}; }
  if (!dc.error) { const st = new Date(d + "T00:00").getTime(), en = st + 864e5; let c = 0;
    (dc.data || []).forEach(r => ((r.data && r.data.events) || []).forEach(ev => { const t = Date.parse(ev.at); if (ev.kind === "sent" && t >= st && t < en) c++; }));
    S.daily.dc = c; }
  if (S.view === "day") render();
}
async function bumpDaily(key, delta) {
  const v = { ...S.daily.v }; v[key] = Math.max(0, (v[key] || 0) + delta); S.daily.v = v; render();
  const text = JSON.stringify(v);
  if (S.daily.row) { const { error } = await sb.from("desk_notes").update({ text }).eq("id", S.daily.row.id); if (error) toast("保存できませんでした"); }
  else { const { data, error } = await sb.from("desk_notes").insert({ day: today(), kind: "daily", text }).select().single(); if (error) toast("保存できませんでした"); else S.daily.row = data; }
}
async function addPV() {
  S.daily.pv = (S.daily.pv || 0) + 1; render();
  const { error } = await sb.from("desk_notes").insert({ day: today(), kind: "pv", text: JSON.stringify({ n: 1 }) });
  if (error) { S.daily.pv--; render(); toast("記録できませんでした"); } else toast(`今月${S.daily.pv}本目を記録しました`);
}
const yen = n => "¥" + Math.round(n).toLocaleString();
function cntHTML(key, label, goal) {
  const n = S.daily.v[key] || 0;
  return `<span class="cnt ${n >= goal ? "ok" : ""}">${label} <b>${n}/${goal}</b><button data-cnt="${key}|-1" aria-label="${label}を1つ減らす">−</button><button data-cnt="${key}|1" aria-label="${label}を1つ増やす">＋</button></span>`;
}
function todayPjHTML() {
  const P = S.projects.filter(p => p.status !== "archived");
  if (!P.length) return "";
  const bar = (pc, color) => `<div class="bar"><i style="width:${Math.max(0, Math.min(100, pc))}%;background:${esc(color)}"></i></div>`;
  const rows = P.map(p => {
    let v = "", body = "";
    if (/ドラコレ/.test(p.name)) {
      const c = S.daily.dc; v = c == null ? "読み込み中" : `営業 ${c}/${DAILY.dcComments}件`;
      body = bar(c ? c / DAILY.dcComments * 100 : 0, p.color) + `<div class="sub2">営業アプリで送ったコメント・DMの数（自動）</div>`;
    } else if (/ぺたろぐ/.test(p.name)) {
      const a = Math.min(S.daily.v.post || 0, DAILY.petaPost), b = Math.min(S.daily.v.call || 0, DAILY.petaCall);
      v = `${Math.round((a + b) / (DAILY.petaPost + DAILY.petaCall) * 100)}%`;
      body = bar((a + b) / (DAILY.petaPost + DAILY.petaCall) * 100, p.color) + `<div class="cnts">${cntHTML("post", "投稿", DAILY.petaPost)}${cntHTML("call", "声かけ", DAILY.petaCall)}</div>`;
    } else if (/VTuber|Vラボ|Vぶい/i.test(p.name)) {
      v = "公開済み"; body = `<div class="sub2">次：最初の登録者を見つけて配信を見に行く</div>`;
    } else if (/PV/.test(p.name)) {
      const n = S.daily.pv; v = n == null ? "読み込み中" : `今月 ${n}本`;
      body = n == null ? "" : `<div class="sub2">売上 ${yen(n * PV_FEE)} ・ 振込（源泉10.21%引き）${yen(n * PV_NET)}</div><div class="cnts"><span class="cnt">納品したら <button data-pvadd style="width:auto;padding:0 10px;font-size:12.5px">＋1本</button></span></div>`;
    } else if (/マッチョ/.test(p.name)) {
      const B = S.body.filter(x => x.day === today()), pro = B.filter(x => x.kind === "meal").reduce((a, x) => a + (+(x.v && x.v.protein) || 0), 0), wk = B.some(x => x.kind === "workout");
      v = `${wk ? "筋トレ✓" : "筋トレまだ"}・たんぱく質${pro}/${DAILY.protein}g`; body = bar(pro / DAILY.protein * 100, p.color);
    } else { v = ""; }
    return `<div class="tp"><div class="row"><button class="nm" data-pjgo="${p.id}">${esc(p.emoji ? p.emoji + " " : "")}${esc(p.name)}</button><span class="v">${v}</span></div>${body}</div>`;
  }).join("");
  return `<div class="today-pj"><div class="hd">プロジェクト（タップで中身へ）</div>${rows}</div>`;
}

  if (e.target.closest("[data-pguide]")) { painGuide(); return; }
  const pg = e.target.closest("[data-pjgo]"); if (pg) { S.view = "proj"; render(); const el = document.getElementById("pj-" + pg.dataset.pjgo); if (el) { el.scrollIntoView({ block: "start" }); scrollBy(0, -10); el.animate([{ boxShadow: "0 0 0 3px var(--acc)" }, { boxShadow: "none" }], { duration: 1400 }); } return; }
  const cn = e.target.closest("[data-cnt]"); if (cn) { const [k, dv] = cn.dataset.cnt.split("|"); bumpDaily(k, +dv); return; }
  if (e.target.closest("[data-pvadd]")) { addPV(); return; }
  const vg = e.target.closest("[data-vg]"); if (vg) { VO.g = vg.dataset.vg; VO.shown = 50; voSave(); render(); return; }
  const vv = e.target.closest("[data-vv]"); if (vv) { const id = vv.closest("[data-voi]").dataset.voi, x = VO.list.find(v => String(v.id) === id); voSet(id, { v: x.v === vv.dataset.vv ? "" : vv.dataset.vv }); return; }
  if (e.target.closest("[data-vomore]")) { VO.shown += 50; render(); return; }
  const pa = e.target.closest("[data-padd]"); if (pa) { addPain(pa.dataset.padd); return; }
  const pd = e.target.closest("[data-pdel]"); if (pd) { delPain(pd.dataset.pdel); return; }
  const st = e.target.closest("[data-step]"); if (st) { const [id, i] = st.dataset.step.split("|").map(Number), t = S.tasks.find(x => x.id === id); const steps = t.steps.map((s, k) => k === i ? { ...s, done: st.checked } : s); await upd(id, { steps }); return; }
  const a = e.target.closest("[data-act]"); if (a) { const [k, id0] = a.dataset.act.split("|"), id = +id0, t = S.tasks.find(x => x.id === id); const now = new Date().toISOString();
    if (k === "start") { const dl = t.start_at ? mins(t.start_at, now) : 0; await upd(id, { status: "doing", act_start: now }); if (Math.abs(dl) >= 5) await shiftAfter(t, dl, true); }
    if (k === "done") { const st0 = t.act_start, dl = t.end_at ? mins(t.end_at, now) : 0; await upd(id, { status: "done", act_end: now, act_min: st0 ? mins(st0, now) : null }); toast("おつかれさまです！"); if (Math.abs(dl) >= 5) await shiftAfter(t, dl, false); }
    if (k === "skip") skipTask(t);
    if (k === "tmr") { const nd = addDays(t.day || today(), 1), sh = iso => iso ? new Date(new Date(iso).getTime() + 864e5).toISOString() : null; await upd(id, { day: nd, start_at: sh(t.start_at), end_at: sh(t.end_at), note: (t.note ? t.note + "\n" : "") + `${t.day || ""}から回した` }); toast("明日に回しました"); }
    if (k === "undo") await upd(id, { status: "todo", act_start: null, act_end: null, act_min: null, skip_reason: "" });
    if (k === "edit") editTask(t);
    return; }
  const card = e.target.closest(".task[data-id]"); if (card && !e.target.closest("input,button")) { const id = +card.dataset.id; S.open.has(id) ? S.open.delete(id) : S.open.add(id); render(); }
});
document.addEventListener("visibilitychange", () => { if (!document.hidden && S.user) load(); });

/* ---------- ログイン ---------- */
function vLogin() {
  $("#tabs").hidden = true;
  $("#main").innerHTML = `<div class="login card"><h1>DESK</h1><div class="sub">ぺたろぐと同じアカウントでログインします</div>
    <label class="lb">メールアドレス</label><input class="f" id="em" type="email" autocomplete="username">
    <label class="lb">パスワード</label><input class="f" id="pw" type="password" autocomplete="current-password">
    <div class="acts" style="margin-top:14px"><button class="btn pri big" id="lg">ログイン</button></div></div>`;
  $("#lg").onclick = async () => { const { error } = await sb.auth.signInWithPassword({ email: $("#em").value.trim(), password: $("#pw").value }); if (error) toast("ログインできませんでした"); else start(); };
}
async function start() {
  const { data } = await sb.auth.getSession(); if (!data.session) return vLogin();
  S.user = data.session.user; $("#tabs").hidden = false; await load();
  // 作業中のタスクがあれば開いておく
  S.tasks.filter(t => t.status === "doing" || (t.day === today() && t.start_at && t.end_at && new Date(t.start_at) <= new Date() && new Date() < new Date(t.end_at))).forEach(t => S.open.add(t.id)); render();
  setInterval(() => { if (S.view === "day" && !document.hidden && $("#sheet").hidden) render(); }, 60000);
}
start();
</script>
